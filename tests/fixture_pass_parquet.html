<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the mirror-floor instrument — the host's frame beside the lab module's</title>
<style>
  html, body { margin:0; height:100%; background:#050507; overflow:hidden; }
  .stage { position:absolute; inset:0; }
  .hidden { visibility:hidden; }
  /* The walk's own markup, as the host reads it: the host arms and decodes both works by finding
     .exh-frame[data-id] in the document, exactly as it does on the real walk. Kept off-screen and
     out of the way so the two full-frame stages above are the only pixels a screenshot sees. */
  #walk { position:absolute; left:-10000px; top:0; width:1px; height:1px; overflow:hidden; }
</style>
</head>
<body>
<!-- TWO ROADS OF ONE FRAME: the host's own canvas (created by pass-layer.js itself, position:fixed
     above everything) and the lab module on its own DOM stage. One is visible at a time; the check
     shows the one it means and photographs it.

     WHAT THE TWO ROADS CAN AND CANNOT BE HELD TO. The module draws with CSS 3D — a hundred and
     twenty-one absolutely positioned tiles, four surfaces each, composited by the browser — so the
     lab road here is the compositor's own projection, its own image downscaling and its own edge
     antialiasing, and never a second run of one sampler. On top of that stands one difference of
     GEOMETRY that no bar can absorb: the module draws its tile SQUARE and paints the picture into
     it with two equal background lengths, which stretches a photograph that is not square, while
     the port gives the tile the frame's own shape so that a door can be the file. So the rows below
     hold the two roads to the MODULE'S OWN NUMBERS — the shares the arrival is spent in, the two
     measured response curves, the die, the sheet's own foot under its own perspective — read
     against the lab file itself, and hold the PICTURE to the works' own files at the doors. The
     module's stage stands here so a reader can see both, and so the port's own repair can be
     photographed beside what it repairs. -->
<div id="moduleStage" class="stage"></div>
<div id="walk">
  <section class="exh-frame" data-id="a"><img id="imgA" src="photos/towers.jpg" alt=""></section>
  <section class="exh-frame" data-id="b"><img id="imgB" src="photos/glassgrid.jpg" alt=""></section>
</div>
<script>
  window.__errs = [];
  window.addEventListener("error", function (e) { window.__errs.push(String((e && e.message) || e)); });
  window.addEventListener("unhandledrejection", function (e) {
    window.__errs.push("rejection: " + String((e && e.reason) || e));
  });
  (function () {
    var real = console.error;
    console.error = function () {
      window.__errs.push(Array.prototype.join.call(arguments, " "));
      return real.apply(console, arguments);
    };
  })();
  // The two names pass-layer.js joins through. `__exPass` is the diagnostics surface the client
  // builds when diagnostics are on; here the bench stands in for it, so the file under test is the
  // real built artifact and nothing about it is stubbed.
  window.__exPass = {};
  window.__exPassLayer = function (h) { window.__host = h; };
</script>
<script src="pass-layer.js"></script>
<script src="parquet.js"></script>
<script>
(function () {
  var imgs = [document.getElementById("imgA"), document.getElementById("imgB")];
  var left = imgs.length;
  imgs.forEach(function (im) {
    if (im.complete && im.naturalWidth) { if (!--left) go(); return; }
    im.onload = function () { if (!--left) go(); };
    im.onerror = function () { window.__errs.push("picture did not load: " + im.src); };
  });

  var asked = false, warmed = false;
  function go() {
    // THE HOST REACHES THIS PAGE ONE FETCH LATER THAN ITS OWN SCRIPT TAG. It reads the site's own
    // settings record first — where every instrument's address, version and digest stand under the
    // instrument's own name — and joins only when that question is settled.
    if (!window.__exPass.bench || !window.__host) { setTimeout(go, 20); return; }
    // EACH INSTRUMENT TRAVELS AS ITS OWN FILE, and a visit fetches only the ones its own score
    // names. This page draws poses as well as commands, so it asks for every instrument the site's
    // record names — by the same road an offer takes — and waits for the answer before it draws.
    if (!warmed) {
      if (!asked) { asked = true; window.__exPass.bench.load(window.__host.report().record.names,
                                    function () { warmed = true; }); }
      setTimeout(go, 20);
      return;
    }
    var moduleStage = document.getElementById("moduleStage");
    var bench = window.__exPass.bench;
    if (!bench || !bench.make()) { window.__errs.push("the host raised no stage"); return; }
    bench.pair(imgs[0], imgs[1]);

    var def = null;
    (window.LAB.effects || []).forEach(function (e) { if (e.id === "parquet") def = e; });
    if (!def) { window.__errs.push("the lab module registered no «parquet» effect"); return; }

    // The one record both roads read. The module keeps its own copy inside its closure; this is the
    // same set handed to it at creation and moved through the same onParam, so a pose the host draws
    // is a pose the module drew and never a guess at it.
    var P = { tiles: 5, depth: 1, lattice: 0, spin: 5.85, shade: 1 };
    var hand = 0, maskAt = 0, seedAt = 4.91016;
    var api = null;

    function build() {
      if (api) { api.destroy(); api = null; }
      var ctx = {
        images: [imgs[0], imgs[1]], reduced: false,
        params: { tiles: P.tiles, turn: 0, seed: seedAt, source: "first" },
      };
      api = def.create(moduleStage, ctx);
      // The module lives its own life until a dial speaks; a score takes it over already standing,
      // which is what these two do.
      api.onParam("pitch", 0);
      api.onParam("clock", 0);
      window.__api = api;
    }
    build();

    // THE MODULE'S OWN TWO DIALS, HANDED THE NUMBERS THE PORT COMPUTED. The port carries both of the
    // module's measured curves, so what is handed over is the CURVED value the port arrived at and
    // the module is told to take it raw — that is the only way the two roads stand at one pose
    // rather than at two readings of one dial. The module's own `setPitch` and `setSource` apply
    // their curves to what they are given, so the bench hands each one the value that inverts to
    // what the port applied; where that is not possible the row says so and reads the module's
    // numbers instead of its pixels.
    window.__labPitch = function (v) { api.onParam("pitch", v); };
    window.__labSource = function (v) { api.onParam("source", v); };
    window.__labClock = function (s) { api.onParam("clock", s); };
    window.__labTiles = function (n) { P.tiles = +n; api.onParam("tiles", n); };

    window.__mix = function (v) { hand = +v; };
    window.__param = function (k, v) { P[k] = +v; };
    window.__mask = function (v) { maskAt = +v; };
    window.__seed = function (v) { seedAt = +v; build(); };
    window.__show = function (which) {
      bench.show(which === "host");
      moduleStage.classList.toggle("hidden", which !== "module");
    };
    // The two drawing buffers, so a row can say the two roads were sampled on one grid rather than
    // assume it.
    window.__buffers = function () {
      var host = document.querySelector("canvas[aria-hidden]");
      var mod = moduleStage.querySelector("canvas");
      return { host: host ? [host.width, host.height] : null,
               module: mod ? [mod.width, mod.height] : null };
    };

    function pose() {
      var host = document.querySelector("canvas[aria-hidden]");
      return { mix: hand, tiles: P.tiles, depth: P.depth, lattice: P.lattice, spin: P.spin,
               shade: P.shade, seed: seedAt, mask: maskAt, reduced: false,
               cssWidth: innerWidth, cssHeight: innerHeight,
               bufWidth: host ? host.width : innerWidth,
               bufHeight: host ? host.height : innerHeight,
               aw: imgs[0].naturalWidth, ah: imgs[0].naturalHeight,
               bw: imgs[1].naturalWidth, bh: imgs[1].naturalHeight };
    }
    var pose_ = pose;
    window.__pose = pose;
    window.__values = function () { return bench.values("parquet", pose()); };

    // THE HOST DRAWS THE SAME POSE, through the same drawPose a running transaction takes.
    window.__hostDraw = function () { bench.draw("parquet", pose()); return bench.values("parquet", pose()); };

    // BOTH ROADS AT ONE POSE. The port's own `values()` answers where the floor and the front stand
    // behind the dial, and those two numbers are handed straight to the module's own two dials.
    window.__both = function (v) {
      hand = +v;
      var r = bench.values("parquet", pose());
      api.onParam("pitch", r.open);
      api.onParam("source", r.arrive);
      return r;
    };

    // ONE POSE WITH ONE HANDLE MOVED, for a measurement that walks one handle: the pose this page
    // stands at, with the named handles overwritten and nothing else touched.
    window.__drawWith = function (o) {
      var p = pose_();
      Object.keys(o || {}).forEach(function (k) { p[k] = o[k]; });
      bench.draw("parquet", p);
      return p;
    };

    // ---- the real transaction road ---------------------------------------------------------
    // A hand-made command of exactly the shape the bundle freezes, offered to the real host: it
    // arms and decodes both works off the walk markup above, builds the programme from the
    // manifest, raises its curtain and runs its own frame loop.
    var gen = 100;
    window.__hooks = { docks: [], curtains: [], glides: [], marks: [] };
    var hooks = {
      dock: function (c) { window.__hooks.docks.push(c.gen); },
      glide: function (c) { window.__hooks.glides.push(c.gen); },
      curtain: function (on) { window.__hooks.curtains.push(!!on); },
      mark: function (n) { window.__hooks.marks.push(n); },
    };
    window.__offer = function (score, opts) {
      opts = opts || {};
      window.__host.configure({
        prepareBudgetMs: 400, settleSlackMs: 2000, fixedScale: true,
        clockPin: opts.clock === undefined ? null : opts.clock,
        progressPin: opts.progress === undefined ? null : opts.progress,
      });
      var cmd = {
        gen: ++gen, from: { id: "a", n: 1 }, to: { id: "b", n: 2 },
        kind: "step", cause: "bench", dir: 1, span: 100, velocity: 0,
        reduced: false, saveData: false, rtl: false, dpr: window.devicePixelRatio || 1,
        viewport: { w: innerWidth, h: innerHeight },
        params: { flightMs: { base: 3000 }, qualityTier: { base: opts.tier || "standard" } },
        score: score,
      };
      return { took: window.__host.offer(cmd, hooks) === true, gen: cmd.gen };
    };
    window.__cancel = function (why) { window.__host.cancel(why || "bench"); };
    window.__report = function () { return window.__host.report(); };
    window.__resize = function () { window.__host.resize({ w: innerWidth, h: innerHeight }); };
    window.__ready = true;
  }
})();
</script>
</body>
</html>
