<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the glass instrument — the host's frame beside the lab module's</title>
<style>
  html, body { margin:0; height:100%; background:#050507; overflow:hidden; }
  .stage { position:absolute; inset:0; }
  .hidden { visibility:hidden; }
  /* The walk's own markup, as the host reads it: the host arms and decodes both works by finding
     .exh-frame[data-id] in the document, exactly as it does on the real walk. Kept off-screen so the
     two full-frame stages are the only pixels a screenshot sees. */
  #walk { position:absolute; left:-10000px; top:0; width:1px; height:1px; overflow:hidden; }
</style>
</head>
<body>
<!-- TWO ROADS OF ONE FRAME, so they can be compared point for point: the host's own canvas (raised by
     pass-layer.js itself) and the lab module on its own stage. One is visible at a time; the check
     shows the one it means and photographs it.

     WHAT THE TWO ROADS COMPARE HERE IS THE MAP AND NOT THE PICTURE, and the reason is the wall. The
     module draws a drifting grid of fourteen finished works and this port draws the pair's own work
     continued past its edge by mirroring, so the two roads never sample the same picture and a
     comparison of colour would compare two walls rather than two readings of one geometry. What IS
     one geometry is the map — the point of the plane the glass shows at each point of the frame —
     and both files are therefore served with their own sampler replaced by the SAME encoder: the
     mapped point, written as colour about the glass's own middle in units of three times its radius.
     The suite says so in the row that reads it, and neither file on disk is touched.

     THE MODULE IS DRIVEN AT ITS OWN SECOND ZERO, which is not an arbitrary instant: at zero its spin
     is nothing and both of its breaths stand at their own middles — 2.30 and 0.78 — which are
     exactly the two numbers this port carries as constants. So the module at second zero and the
     port at any hand are the same arithmetic, and the row measures that rather than assuming it. -->
<div id="moduleStage" class="stage"></div>
<div id="walk">
  <section class="exh-frame" data-id="a"><img id="imgA" src="photos/glassgrid.jpg" alt=""></section>
  <section class="exh-frame" data-id="b"><img id="imgB" src="photos/towers.jpg" alt=""></section>
</div>
<script>
  window.__errs = [];
  window.addEventListener("error", function (e) { window.__errs.push(String((e && e.message) || e)); });
  window.addEventListener("unhandledrejection", function (e) {
    window.__errs.push("rejection: " + String((e && e.reason) || e));
  });
  (function () {
    var real = console.error;
    console.error = function () {
      window.__errs.push(Array.prototype.join.call(arguments, " "));
      return real.apply(console, arguments);
    };
  })();
  // The two names pass-layer.js joins through. `__exPass` is the diagnostics surface the client
  // builds when diagnostics are on; here the bench stands in for it, so the file under test is the
  // real built artifact and nothing about it is stubbed.
  window.__exPass = {};
  window.__exPassLayer = function (h) { window.__host = h; };
</script>
<script src="pass-layer.js"></script>
<script src="lens.js"></script>
<script>
(function () {
  var imgs = [document.getElementById("imgA"), document.getElementById("imgB")];
  var left = imgs.length;
  imgs.forEach(function (im) {
    if (im.complete && im.naturalWidth) { if (!--left) go(); return; }
    im.onload = function () { if (!--left) go(); };
    im.onerror = function () { window.__errs.push("picture did not load: " + im.src); };
  });

  var asked = false, warmed = false;
  function go() {
    // The host reaches this page one fetch later than its own script tag: it reads the site's own
    // settings record first — where every instrument's address, version and digest stand — and joins
    // only when that question is settled.
    if (!window.__exPass.bench || !window.__host) { setTimeout(go, 20); return; }
    // Each instrument travels as its own file, and a visit fetches only the ones its score names.
    if (!warmed) {
      if (!asked) { asked = true; window.__exPass.bench.load(window.__host.report().record.names,
                                    function () { warmed = true; }); }
      setTimeout(go, 20);
      return;
    }
    var moduleStage = document.getElementById("moduleStage");
    var bench = window.__exPass.bench;
    if (!bench || !bench.make()) { window.__errs.push("the host raised no stage"); return; }
    bench.pair(imgs[0], imgs[1]);

    var def = null;
    (window.LAB.effects || []).forEach(function (e) { if (e.id === "lens") def = e; });
    if (!def) { window.__errs.push("the lab module registered no «lens» effect"); return; }

    // The pose both roads read. The module keeps its own copy inside its closure; this is the same
    // set handed to it at creation and moved through the same onParam.
    var P = { fold: 0, wedges: 6, twist: 1, power: 2, centreX: 0.5, centreY: 0.5,
              shade: 1, mask: 0 };
    var hand = 0;
    var api = null;
    var RULES = ["kaleidoscope", "swirl", "magnify"];

    function build() {
      if (api) { api.destroy(); api = null; }
      var ctx = {
        images: [imgs[0], imgs[1]], reduced: false,
        params: { rule: RULES[P.fold], size: 0.22, drift: 0, seed: 1 },
        pointer: { x: 0.5, y: 0.5, inside: false, down: false },
      };
      api = def.create(moduleStage, ctx);
      // THE MODULE IS DRIVEN AT ITS OWN SECOND ZERO and by nothing else. Its own walk puts the glass
      // where second zero puts it; the port is handed that very place through its two centre
      // handles, so the two roads stand at one glass.
      api.onParam("clock", 0);
      window.__api = api;
    }
    build();

    // WHERE THE MODULE'S OWN WALK PUTS THE GLASS AT SECOND ZERO (lens.js:415-417), and the same
    // place in the port's own terms — the record reads a centre down from the TOP of the frame and
    // the module's shader reads it UP from the bottom, so the second of the two is turned over here.
    var LAB_X = 0.5 + 0.33 * Math.sin(0) + 0.06 * Math.sin(0);
    var LAB_Y = 0.5 + 0.30 * Math.sin(1.3);
    window.__labPlace = function () { return { x: LAB_X, y: LAB_Y, centreX: LAB_X,
                                              centreY: 1 - LAB_Y }; };

    window.__mix = function (v) { hand = +v; };
    window.__param = function (k, v) {
      P[k] = +v;
      if (k === "fold") { build(); return P; }
      return P;
    };
    window.__mask = function (v) { P.mask = +v; };
    // The module's own reach, handed in as the share of the frame's short side it takes. Its dial
    // stands at 1 while no `lens` is handed, so its radius is exactly that share.
    window.__labSize = function (share) {
      api.onParam("size", share);
      api.onParam("clock", 0);
      return share;
    };
    window.__show = function (which) {
      bench.show(which === "host");
      moduleStage.classList.toggle("hidden", which !== "module");
    };
    // The two drawing buffers, so a row can say the two roads were sampled on one grid rather than
    // assume it.
    window.__buffers = function () {
      var host = document.querySelector("canvas[aria-hidden]");
      var mod = moduleStage.querySelector("canvas");
      return { host: host ? [host.width, host.height] : null,
               module: mod ? [mod.width, mod.height] : null };
    };

    function pose() {
      var host = document.querySelector("canvas[aria-hidden]");
      return { mix: hand, fold: P.fold, wedges: P.wedges, twist: P.twist, power: P.power,
               centreX: P.centreX, centreY: P.centreY, shade: P.shade, mask: P.mask,
               reduced: false,
               cssWidth: innerWidth, cssHeight: innerHeight,
               bufWidth: host ? host.width : innerWidth,
               bufHeight: host ? host.height : innerHeight,
               aw: imgs[0].naturalWidth, ah: imgs[0].naturalHeight,
               bw: imgs[1].naturalWidth, bh: imgs[1].naturalHeight };
    }
    window.__pose = pose;
    window.__values = function () { return bench.values("lens", pose()); };
    // THE HOST DRAWS THE SAME POSE, through the same drawPose a running transaction takes.
    window.__hostDraw = function () { bench.draw("lens", pose()); return bench.values("lens", pose()); };
    window.__both = function (v) { hand = +v; return bench.values("lens", pose()); };

    // ---- the real transaction road ---------------------------------------------------------
    var gen = 100;
    window.__hooks = { docks: [], curtains: [], glides: [], marks: [] };
    var hooks = {
      dock: function (c) { window.__hooks.docks.push(c.gen); },
      glide: function (c) { window.__hooks.glides.push(c.gen); },
      curtain: function (on) { window.__hooks.curtains.push(!!on); },
      mark: function (n) { window.__hooks.marks.push(n); },
    };
    window.__offer = function (score, opts) {
      opts = opts || {};
      window.__host.configure({
        prepareBudgetMs: 400, settleSlackMs: 2000, fixedScale: true,
        clockPin: opts.clock === undefined ? null : opts.clock,
        progressPin: opts.progress === undefined ? null : opts.progress,
      });
      var cmd = {
        gen: ++gen, from: { id: "a", n: 1 }, to: { id: "b", n: 2 },
        kind: "step", cause: "bench", dir: 1, span: 100, velocity: 0,
        reduced: false, saveData: false, rtl: false, dpr: window.devicePixelRatio || 1,
        viewport: { w: innerWidth, h: innerHeight },
        params: { flightMs: { base: 3000 }, qualityTier: { base: opts.tier || "standard" } },
        score: score,
      };
      return { took: window.__host.offer(cmd, hooks) === true, gen: cmd.gen };
    };
    window.__cancel = function (why) { window.__host.cancel(why || "bench"); };
    window.__report = function () { return window.__host.report(); };
    window.__resize = function () { window.__host.resize({ w: innerWidth, h: innerHeight }); };
    window.__ready = true;
  }
})();
</script>
</body>
</html>
