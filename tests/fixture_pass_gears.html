<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the meshing instrument — the host's frame beside the lab module's</title>
<style>
  html, body { margin:0; height:100%; background:#050507; overflow:hidden; }
  .stage { position:absolute; inset:0; }
  .hidden { visibility:hidden; }
  /* The walk's own markup, as the host reads it: the host arms and decodes both works by finding
     .exh-frame[data-id] in the document, exactly as it does on the real walk. Kept off-screen and
     out of the way so the two full-frame stages above are the only pixels a screenshot sees. */
  #walk { position:absolute; left:-10000px; top:0; width:1px; height:1px; overflow:hidden; }
</style>
</head>
<body>
<!-- TWO ROADS OF ONE FRAME, so they can be compared point for point: the host's own canvas (created
     by pass-layer.js itself, position:fixed above everything) and the lab module on its own canvas.
     One is visible at a time; the check shows the one it means and photographs it. -->
<div id="moduleStage" class="stage"></div>
<div id="walk">
  <section class="exh-frame" data-id="a"><img id="imgA" src="photos/towers.jpg" alt=""></section>
  <section class="exh-frame" data-id="b"><img id="imgB" src="photos/glassgrid.jpg" alt=""></section>
</div>
<script>
  window.__errs = [];
  window.addEventListener("error", function (e) { window.__errs.push(String((e && e.message) || e)); });
  window.addEventListener("unhandledrejection", function (e) {
    window.__errs.push("rejection: " + String((e && e.reason) || e));
  });
  (function () {
    var real = console.error;
    console.error = function () {
      window.__errs.push(Array.prototype.join.call(arguments, " "));
      return real.apply(console, arguments);
    };
  })();
  // The two names pass-layer.js joins through. `__exPass` is the diagnostics surface the client
  // builds when diagnostics are on; here the bench stands in for it, so the file under test is the
  // real built artifact and nothing about it is stubbed.
  window.__exPass = {};
  window.__exPassLayer = function (h) { window.__host = h; };
</script>
<script src="pass-layer.js"></script>
<script src="gears.js"></script>
<script>
(function () {
  var imgs = [document.getElementById("imgA"), document.getElementById("imgB")];

  // THE MASK'S OWN TWO WORKS. A flat white work and a flat black one, so what the frame shows is the
  // instrument's own field and nothing of any photograph. The radial and the banding measures then
  // read the mask itself — which is the thing whose reading is supposed to travel — instead of
  // reading two photographs through it.
  function solid(hex) {
    var c = document.createElement("canvas");
    c.width = c.height = 4;
    var g = c.getContext("2d");
    g.fillStyle = hex;
    g.fillRect(0, 0, 4, 4);
    var im = new Image();
    im.src = c.toDataURL("image/png");
    return im;
  }
  var flat = [solid("#ffffff"), solid("#000000")];

  var waiting = imgs.concat(flat);
  var left = waiting.length;
  waiting.forEach(function (im) {
    if (im.complete && im.naturalWidth) { if (!--left) go(); return; }
    im.onload = function () { if (!--left) go(); };
    im.onerror = function () { window.__errs.push("picture did not load: " + im.src.slice(0, 60)); };
  });

  function go() {
    // THE HOST REACHES THIS PAGE ONE FETCH LATER THAN ITS OWN SCRIPT TAG. Since 2026-08-14 the
    // instruments live in pass-pack.js, which the host fetches by address and loads once its bytes
    // weigh to the digest the build stamped; the host joins only when that question is settled.
    // So the bench is waited for rather than assumed, which is what a real visitor's walk does too.
    if (!window.__exPass.bench || !window.__host) { setTimeout(go, 20); return; }
    var moduleStage = document.getElementById("moduleStage");
    var bench = window.__exPass.bench;
    if (!bench || !bench.make()) { window.__errs.push("the host raised no stage"); return; }
    bench.pair(imgs[0], imgs[1]);
    var loaded = "photos";
    window.__source = function (which) {
      if (which === undefined || which === loaded) return loaded;
      loaded = which;
      bench.pair.apply(null, which === "flat" ? flat : imgs);
      return loaded;
    };

    var def = null;
    (window.LAB.effects || []).forEach(function (e) { if (e.id === "gears") def = e; });
    var ctx = { images: imgs, pointer: { x: 0.5, y: 0.5, inside: false, down: false },
                params: { teeth: 6, ratio: 0.5, turn: 0.55, mesh: 0.4, lead: 0.4, seed: 20260814 },
                reduced: false };
    var api = def.create(moduleStage, ctx);
    window.__api = api;

    window.__mix = function (v) { api.onParam("mix", v); };
    window.__clock = function (s) { api.onParam("clock", s); };
    window.__param = function (k, v) { api.onParam(k, v); };
    window.__reading = function () { return api.reading(); };
    window.__show = function (which) {
      bench.show(which === "host");
      moduleStage.classList.toggle("hidden", which !== "module");
    };

    // THE HOST DRAWS THE SAME POSE. The numbers are taken from the module through its own reading(),
    // so what is compared is two roads of one frame and never two guesses at one. The module holds
    // its pair's size and its tooth pitch as constants and counts its teeth as a whole number across
    // the frame's height; the port publishes both as handles, so the bench hands the handle values
    // that stand for exactly the module's own two constants.
    window.__hostDraw = function () {
      var r = api.reading();
      var cv = moduleStage.querySelector("canvas");
      var src = window.__source() === "flat" ? flat : imgs;
      var pose = {
        dial: r.dial,                       // the module's own travelled number, curve and all
        size: 4.5,                          // gears.js R_BASE
        centreX: 0.5, centreY: 0.5,         // the module pins the pair to the middle of the frame
        bandPeriod: 1 / 6,                  // gears.js `teeth` = 6 across the height
        ratio: 0.5, tooth: 0.4, order: 0.4, turn: 0.55, flank: 0.35,
        shade: 1, travel: 1,
        cssWidth: cv.width, cssHeight: cv.height,   // the aspect the module's own frame reads
        t: r.clock === null ? 0 : r.clock, reduced: r.reduced,
        aw: src[0].naturalWidth, ah: src[0].naturalHeight,
        bw: src[1].naturalWidth, bh: src[1].naturalHeight,
      };
      bench.draw("gears", pose);
      return { reading: r, pose: pose, values: window.__exPass.bench.values("gears", pose) };
    };

    // ONE POSE, HANDED IN WHOLE. The sweep rows state the handles they mean and photograph what the
    // host draws, so a claim about a handle is a picture and not a record.
    window.__poseDraw = function (over) {
      var cv = document.querySelector("canvas");
      var src = window.__source() === "flat" ? flat : imgs;
      var pose = {
        dial: 0.5, size: 4.5, centreX: 0.5, centreY: 0.5, bandPeriod: 1 / 6, ratio: 0.5,
        tooth: 0.4, order: 0.4, turn: 0.55, flank: 0.35, shade: 1, travel: 1,
        cssWidth: innerWidth, cssHeight: innerHeight, t: 0, reduced: false,
        aw: src[0].naturalWidth, ah: src[0].naturalHeight,
        bw: src[1].naturalWidth, bh: src[1].naturalHeight,
      };
      Object.keys(over || {}).forEach(function (k) { pose[k] = over[k]; });
      bench.draw("gears", pose);
      return window.__exPass.bench.values("gears", pose);
    };

    // ---- the real transaction road ---------------------------------------------------------
    // A hand-made command of exactly the shape the bundle freezes, offered to the real host: it
    // arms and decodes both works off the walk markup above, builds the programme from the
    // manifest, raises its curtain and runs its own frame loop.
    var gen = 100;
    window.__hooks = { docks: [], curtains: [], glides: [], marks: [] };
    var hooks = {
      dock: function (c) { window.__hooks.docks.push(c.gen); },
      glide: function (c) { window.__hooks.glides.push(c.gen); },
      curtain: function (on) { window.__hooks.curtains.push(!!on); },
      mark: function (n) { window.__hooks.marks.push(n); },
    };
    window.__offer = function (score, opts) {
      opts = opts || {};
      window.__host.configure({
        prepareBudgetMs: 400, settleSlackMs: 2000, fixedScale: true,
        clockPin: opts.clock === undefined ? null : opts.clock,
        progressPin: opts.progress === undefined ? null : opts.progress,
      });
      var cmd = {
        gen: ++gen, from: { id: "a", n: 1 }, to: { id: "b", n: 2 },
        kind: "step", cause: "bench", dir: 1, span: 100, velocity: 0,
        reduced: !!opts.reduced, saveData: false, rtl: false, dpr: window.devicePixelRatio || 1,
        viewport: { w: innerWidth, h: innerHeight },
        params: { flightMs: { base: 3000 }, qualityTier: { base: opts.tier || "standard" } },
        score: score,
      };
      return { took: window.__host.offer(cmd, hooks) === true, gen: cmd.gen };
    };
    window.__cancel = function (why) { window.__host.cancel(why || "bench"); };
    window.__report = function () { return window.__host.report(); };
    window.__ready = true;
  }
})();
</script>
</body>
</html>
