<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the live-mirror instrument — the host's frame beside the lab module's</title>
<style>
  html, body { margin:0; height:100%; background:#050507; overflow:hidden; }
  .stage { position:absolute; inset:0; }
  .hidden { visibility:hidden; }
  /* The walk's own markup, as the host reads it: the host arms and decodes both works by finding
     .exh-frame[data-id] in the document, exactly as it does on the real walk. Kept off-screen and
     out of the way so the two full-frame stages above are the only pixels a screenshot sees. */
  #walk { position:absolute; left:-10000px; top:0; width:1px; height:1px; overflow:hidden; }
</style>
</head>
<body>
<!-- TWO ROADS OF ONE FRAME, so they can be compared point for point: the host's own canvas (created
     by pass-layer.js itself, position:fixed above everything) and the lab module on its own stage.
     One is visible at a time; the check shows the one it means and photographs it.

     BOTH ROADS DRAW WITH WEBGL HERE, and both run ONE fragment shader over one rasteriser, so the
     residual between them is a difference of arithmetic rather than of samplers.

     THE LAB MODULE IS SERVED EXACTLY AS IT STANDS. Nothing of it is changed by this bench: the port
     carries every one of its numbers, and the two places the two roads cannot be identical by
     construction are named in the suite rather than levelled away here — the module wraps its own
     texture MIRRORED_REPEAT where the host binds CLAMP_TO_EDGE and the port writes the wrap into
     the shader, and the module is a one-work module where a cue carries an ordered pair. -->
<div id="moduleStage" class="stage"></div>
<div id="walk">
  <section class="exh-frame" data-id="a"><img id="imgA" src="photos/glassgrid.jpg" alt=""></section>
  <section class="exh-frame" data-id="b"><img id="imgB" src="photos/towers.jpg" alt=""></section>
</div>
<script>
  window.__errs = [];
  window.addEventListener("error", function (e) { window.__errs.push(String((e && e.message) || e)); });
  window.addEventListener("unhandledrejection", function (e) {
    window.__errs.push("rejection: " + String((e && e.reason) || e));
  });
  (function () {
    var real = console.error;
    console.error = function () {
      window.__errs.push(Array.prototype.join.call(arguments, " "));
      return real.apply(console, arguments);
    };
  })();
  // The two names pass-layer.js joins through. `__exPass` is the diagnostics surface the client
  // builds when diagnostics are on; here the bench stands in for it, so the file under test is the
  // real built artifact and nothing about it is stubbed.
  window.__exPass = {};
  window.__exPassLayer = function (h) { window.__host = h; };
</script>
<script src="pass-layer.js"></script>
<script src="livemirror.js"></script>
<script>
(function () {
  var imgs = [document.getElementById("imgA"), document.getElementById("imgB")];
  var left = imgs.length;
  imgs.forEach(function (im) {
    if (im.complete && im.naturalWidth) { if (!--left) go(); return; }
    im.onload = function () { if (!--left) go(); };
    im.onerror = function () { window.__errs.push("picture did not load: " + im.src); };
  });

  var asked = false, warmed = false;
  function go() {
    // THE HOST REACHES THIS PAGE ONE FETCH LATER THAN ITS OWN SCRIPT TAG. It reads the site's own
    // settings record first — where every instrument's address, version and digest stand under the
    // instrument's own name — and joins only when that question is settled.
    if (!window.__exPass.bench || !window.__host) { setTimeout(go, 20); return; }
    if (!warmed) {
      if (!asked) { asked = true; window.__exPass.bench.load(window.__host.report().record.names,
                                    function () { warmed = true; }); }
      setTimeout(go, 20);
      return;
    }
    var moduleStage = document.getElementById("moduleStage");
    var bench = window.__exPass.bench;
    if (!bench || !bench.make()) { window.__errs.push("the host raised no stage"); return; }
    bench.pair(imgs[0], imgs[1]);

    var def = null;
    (window.LAB.effects || []).forEach(function (e) { if (e.id === "livemirror") def = e; });
    if (!def) { window.__errs.push("the lab module registered no «livemirror» effect"); return; }

    // THE ONE POSE BOTH ROADS READ. `MODE` is the module's own `mode` param under the port's own
    // name for it; `CLOCK` is the second handed to both; `DIAL` is how far the photograph has become
    // a fold, which the module takes as its own `fold` handle and the port takes through the first
    // half of its hand.
    var MODES = ["down the middle", "across the middle", "both", "diagonal"];
    var P = { axis: 2, centreX: 0.5, centreY: 0.5, drift: 1, glint: 0.62, shade: 0.62,
              propagate: 0 };
    var DIAL = 0, CLOCK = 0, maskAt = 0;
    var api = null;

    // THE MODULE IS BUILT AT THE PORT'S OWN RESTING POSE and driven by its own two driver handles,
    // `clock` and `fold`, which are the handles it publishes for exactly this — a hand outside the
    // module taking the second and the dial. Its `line` and `breath` handles are left at null, which
    // is the module living its own life about the middle of the frame, and that is the pose the port
    // answers with `centreX`/`centreY` at a half and `drift` whole.
    function build() {
      if (api) { api.destroy(); api = null; }
      var ctx = {
        images: [imgs[0], imgs[1]], reduced: false,
        params: { mode: MODES[P.axis], photograph: "stairwell", drift: P.drift > 0 ? "on" : "off" },
      };
      api = def.create(moduleStage, ctx);
      api.onParam("clock", CLOCK);
      api.onParam("fold", DIAL);
      window.__api = api;
    }
    build();

    // THE HAND THAT PUTS THE PORT AT THE MODULE'S OWN DIAL. The port's hand runs the fold in over
    // the first forty-six hundredths, holds the wholly mirrored frame for eight, and opens it out
    // over the last forty-six, so a dial of D on the way in is a hand of D x 0.46 — and there the
    // exchange stands at exactly nothing, which is the module's own one-work frame.
    var SHUT_IN = 0.46;
    function handOf(dial) { return dial * SHUT_IN; }

    window.__dial = function (v) { DIAL = +v; api.onParam("fold", DIAL); };
    window.__clock = function (v) { CLOCK = +v; api.onParam("clock", CLOCK); };
    window.__param = function (k, v) {
      P[k] = +v;
      if (k === "axis" || k === "drift") build();
    };
    window.__mask = function (v) { maskAt = +v; };
    window.__show = function (which) {
      bench.show(which === "host");
      moduleStage.classList.toggle("hidden", which !== "module");
    };
    // The two drawing buffers, so a row can say the two roads were sampled on one grid rather than
    // assume it. The host's canvas is the one it marks aria-hidden; the module's is the one inside
    // its own stage.
    window.__buffers = function () {
      var host = document.querySelector("canvas[aria-hidden]");
      var mod = moduleStage.querySelector("canvas");
      return { host: host ? [host.width, host.height] : null,
               module: mod ? [mod.width, mod.height] : null };
    };

    // The seating of one work over the drawing buffer, computed here the way the host computes it
    // for the running transaction, so the door's own reading walks the very cover fit the shader
    // will sample through rather than the tightest one it could assume.
    function fitOf(iw, ih, w, h) {
      var fa = w / Math.max(h, 1), ia = iw / Math.max(ih, 1);
      return ia > fa ? [fa / ia, 1, 0, 0] : [1, ia / fa, 0, 0];
    }

    // The pose the host draws, at a named hand. `hand` null means «the hand that stands at the
    // module's own dial», which is what every two-roads row asks for.
    function pose(hand) {
      var host = document.querySelector("canvas[aria-hidden]");
      var gw = host ? host.width : innerWidth, gh = host ? host.height : innerHeight;
      return { mix: hand === null || hand === undefined ? handOf(DIAL) : hand,
               axis: P.axis, centreX: P.centreX, centreY: P.centreY, drift: P.drift,
               glint: P.glint, shade: P.shade, propagate: P.propagate,
               mask: maskAt, clock: CLOCK, reduced: false,
               cssWidth: innerWidth, cssHeight: innerHeight,
               bufWidth: gw, bufHeight: gh,
               fitA: fitOf(imgs[0].naturalWidth, imgs[0].naturalHeight, gw, gh),
               fitB: fitOf(imgs[1].naturalWidth, imgs[1].naturalHeight, gw, gh),
               aw: imgs[0].naturalWidth, ah: imgs[0].naturalHeight,
               bw: imgs[1].naturalWidth, bh: imgs[1].naturalHeight };
    }
    window.__pose = pose;
    window.__values = function (hand) { return bench.values("livemirror", pose(hand)); };

    // THE HOST DRAWS THE SAME POSE, through the same drawPose a running transaction takes.
    window.__hostDraw = function (hand) {
      bench.draw("livemirror", pose(hand));
      return bench.values("livemirror", pose(hand));
    };

    // THE HOST HOLDS ONE POSE ON ITS OWN FRAME LOOP, which is what a running transaction does and
    // what a bench drawing one frame does not. It matters for a photograph: the stage's context is
    // created with `preserveDrawingBuffer: false` and the lab module's stage is hidden while the
    // host's frame is being read, so a page that draws once and then stands still gives the
    // compositor nothing to do and a capture returns whatever it last composited. Walked across
    // twenty-one marks of the hand that showed up as eight consecutive marks photographing one
    // frame and the ninth carrying all of their change at once. Holding the pose on rAF puts the
    // pose in the frame the capture takes, and it is the same drawPose either way.
    // THE HOST'S OWN DRAWING BUFFER, READ DIRECTLY, with no compositor between. A screenshot reads
    // what the page last COMPOSITED, and a page whose only moving pixels are inside a hidden
    // element gives the compositor leave to coalesce — walked across twenty-one marks of the hand
    // that showed up as eight marks photographing one frame and the ninth carrying all their
    // change. Copying the stage into a plain 2D canvas in the SAME task the pose was drawn in
    // reads the buffer itself, which is the frame the instrument actually produced.
    window.__grab = function (hand) {
      bench.draw("livemirror", pose(hand));
      var src = document.querySelector("canvas[aria-hidden]");
      var c = document.createElement("canvas");
      c.width = src.width; c.height = src.height;
      c.getContext("2d").drawImage(src, 0, 0);
      return c.toDataURL("image/png");
    };

    var holdRaf = 0, holdHand = null, holdOn = false;
    window.__hold = function (hand) {
      holdHand = hand;
      if (holdOn) return;
      holdOn = true;
      (function tick() {
        if (!holdOn) return;
        holdRaf = requestAnimationFrame(tick);
        bench.draw("livemirror", pose(holdHand));
      })();
    };
    window.__release = function () {
      holdOn = false;
      if (holdRaf) cancelAnimationFrame(holdRaf);
      holdRaf = 0;
    };

    // BOTH ROADS AT ONE DIAL. One number goes to the module's own `fold` handle and, through the
    // hand above, to the port; the two are then standing at one pose.
    window.__both = function (v) {
      DIAL = +v;
      api.onParam("fold", DIAL);
      return bench.values("livemirror", pose(null));
    };

    // ---- the real transaction road ---------------------------------------------------------
    // A hand-made command of exactly the shape the bundle freezes, offered to the real host: it
    // arms and decodes both works off the walk markup above, builds the programme from the
    // manifest, raises its curtain and runs its own frame loop.
    var gen = 100;
    window.__hooks = { docks: [], curtains: [], glides: [], marks: [] };
    var hooks = {
      dock: function (c) { window.__hooks.docks.push(c.gen); },
      glide: function (c) { window.__hooks.glides.push(c.gen); },
      curtain: function (on) { window.__hooks.curtains.push(!!on); },
      mark: function (n) { window.__hooks.marks.push(n); },
    };
    window.__offer = function (score, opts) {
      opts = opts || {};
      window.__host.configure({
        prepareBudgetMs: 400, settleSlackMs: 2000, fixedScale: true,
        clockPin: opts.clock === undefined ? null : opts.clock,
        progressPin: opts.progress === undefined ? null : opts.progress,
      });
      var cmd = {
        gen: ++gen, from: { id: "a", n: 1 }, to: { id: "b", n: 2 },
        kind: "step", cause: "bench", dir: 1, span: 100, velocity: 0,
        reduced: false, saveData: false, rtl: false, dpr: window.devicePixelRatio || 1,
        viewport: { w: innerWidth, h: innerHeight },
        params: { flightMs: { base: 3000 }, qualityTier: { base: opts.tier || "standard" } },
        score: score,
      };
      return { took: window.__host.offer(cmd, hooks) === true, gen: cmd.gen };
    };
    window.__cancel = function (why) { window.__host.cancel(why || "bench"); };
    window.__report = function () { return window.__host.report(); };
    window.__resize = function () { window.__host.resize({ w: innerWidth, h: innerHeight }); };
    window.__ready = true;
  }
})();
</script>
</body>
</html>
