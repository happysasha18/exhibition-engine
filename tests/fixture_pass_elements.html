<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the elements — one instrument of shelf 14 on the host's own frame</title>
<style>
  html, body { margin:0; height:100%; background:#050507; overflow:hidden; }
  /* The walk's own markup, as the host reads it: the host arms and decodes both works by finding
     .exh-frame[data-id] in the document, exactly as it does on the real walk. Kept off-screen so
     the host's own full-frame canvas is the only pixels a screenshot sees. */
  #walk { position:absolute; left:-10000px; top:0; width:1px; height:1px; overflow:hidden; }
</style>
</head>
<body>
<!-- ONE BENCH FOR THE THREE INSTRUMENTS OF CHARTER SHELF 14, and one file rather than three because
     there is nothing per-instrument in it. Every other instrument's bench page stands two roads side
     by side — the host's frame and the lab module's — and these three have no lab module to stand
     beside: they were authored against the charter rather than ported. What is left is the same page
     for all three: the real built host, the real built instrument files, the two photographs, and a
     hand that draws one pose. Which instrument is drawn arrives in the address, so the suites differ
     in nothing but the name they ask for. -->
<div id="walk">
  <section class="exh-frame" data-id="a"><img id="imgA" src="photos/towers.jpg" alt=""></section>
  <section class="exh-frame" data-id="b"><img id="imgB" src="photos/glassgrid.jpg" alt=""></section>
</div>
<script>
  window.__errs = [];
  window.addEventListener("error", function (e) { window.__errs.push(String((e && e.message) || e)); });
  window.addEventListener("unhandledrejection", function (e) {
    window.__errs.push("rejection: " + String((e && e.reason) || e));
  });
  (function () {
    var real = console.error;
    console.error = function () {
      window.__errs.push(Array.prototype.join.call(arguments, " "));
      return real.apply(console, arguments);
    };
  })();
  // The two names pass-layer.js joins through. `__exPass` is the diagnostics surface the client
  // builds when diagnostics are on; here the bench stands in for it, so the file under test is the
  // real built artifact and nothing about it is stubbed.
  window.__exPass = {};
  window.__exPassLayer = function (h) { window.__host = h; };
</script>
<script src="pass-layer.js"></script>
<script>
(function () {
  var WHICH = (location.hash || "#pour").slice(1);
  window.__which = WHICH;
  var imgs = [document.getElementById("imgA"), document.getElementById("imgB")];
  var left = imgs.length;
  imgs.forEach(function (im) {
    if (im.complete && im.naturalWidth) { if (!--left) go(); return; }
    im.onload = function () { if (!--left) go(); };
    im.onerror = function () { window.__errs.push("picture did not load: " + im.src); };
  });

  var asked = false, warmed = false;
  function go() {
    // THE HOST REACHES THIS PAGE ONE FETCH LATER THAN ITS OWN SCRIPT TAG. It reads the site's own
    // settings record first — where every instrument's address, version and digest stand under the
    // instrument's own name — and joins only when that question is settled.
    if (!window.__exPass.bench || !window.__host) { setTimeout(go, 20); return; }
    // EACH INSTRUMENT TRAVELS AS ITS OWN FILE, fetched by the same road an offer takes, weighed
    // against the digest the record carries and refused with its reason where either disagrees.
    if (!warmed) {
      if (!asked) {
        asked = true;
        window.__exPass.bench.load(window.__host.report().record.names, function (whys) {
          window.__loadWhys = whys;
          warmed = true;
        });
      }
      setTimeout(go, 20);
      return;
    }
    var bench = window.__exPass.bench;
    if (!bench.make()) { window.__errs.push("the host raised no stage"); return; }
    bench.pair(imgs[0], imgs[1]);

    window.__manifest = function () { return bench.manifest(WHICH); };
    window.__values = function (pose) { return bench.values(WHICH, seat(pose)); };
    // ONE POSE, DRAWN. Every handle the manifest publishes takes its own rest unless the caller
    // names it, so a row states only what it means to move and the rest of the frame is the
    // instrument's own neutral.
    function seat(pose) {
      var man = bench.manifest(WHICH), out = {};
      Object.keys(man.handles).forEach(function (h) {
        out[h] = man.handles[h]["def"];
      });
      out.t = 0;
      out.reduced = false;
      out.cssWidth = innerWidth;
      out.cssHeight = innerHeight;
      out.bufWidth = Math.round(innerWidth * (window.devicePixelRatio || 1));
      out.bufHeight = Math.round(innerHeight * (window.devicePixelRatio || 1));
      Object.keys(pose || {}).forEach(function (k) { out[k] = pose[k]; });
      out.aw = imgs[0].naturalWidth; out.ah = imgs[0].naturalHeight;
      out.bw = imgs[1].naturalWidth; out.bh = imgs[1].naturalHeight;
      return out;
    }
    window.__draw = function (pose) {
      bench.show(true);
      return bench.draw(WHICH, seat(pose));
    };

    // ---- the real transaction road -------------------------------------------------------------
    // A hand-made command of exactly the shape the bundle freezes, offered to the real host: it arms
    // and decodes both works off the walk markup above, builds the programme from the manifest,
    // raises its curtain and runs its own frame loop.
    var gen = 100;
    window.__hooks = { docks: [], curtains: [], glides: [], marks: [] };
    var hooks = {
      dock: function (c) { window.__hooks.docks.push(c.gen); },
      glide: function (c) { window.__hooks.glides.push(c.gen); },
      curtain: function (on) { window.__hooks.curtains.push(!!on); },
      mark: function (n) { window.__hooks.marks.push(n); },
    };
    window.__offer = function (score, opts) {
      opts = opts || {};
      window.__host.configure({
        prepareBudgetMs: 400, settleSlackMs: 2000, fixedScale: true,
        clockPin: opts.clock === undefined ? null : opts.clock,
        progressPin: opts.progress === undefined ? null : opts.progress,
      });
      var cmd = {
        gen: ++gen, from: { id: "a", n: 1 }, to: { id: "b", n: 2 },
        kind: "step", cause: "bench", dir: 1, span: 100, velocity: 0,
        reduced: false, saveData: false, rtl: false, dpr: window.devicePixelRatio || 1,
        viewport: { w: innerWidth, h: innerHeight },
        params: { flightMs: { base: 3000 }, qualityTier: { base: opts.tier || "standard" } },
        score: score,
      };
      return { took: window.__host.offer(cmd, hooks) === true, gen: cmd.gen };
    };
    window.__report = function () { return window.__host.report(); };
    window.__ready = true;
  }
})();
</script>
</body>
</html>
