<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pass-pack bench</title>
<style>html,body{margin:0;background:#111;height:100%}</style>
</head>
<body>
<script>
  // Every console error and every uncaught throw, kept so a row can read them rather than guess.
  window.__errs = [];
  window.onerror = function (m) { window.__errs.push(String(m)); };
  (function () {
    var real = console.error;
    console.error = function () {
      window.__errs.push(Array.prototype.join.call(arguments, " "));
      return real.apply(console, arguments);
    };
  })();
  // The bundle's two globals, standing in for the client so the file under test is the real built
  // artifact with nothing about it stubbed: the diagnostics surface it hangs its bench on, and the
  // join point it reaches the walk through.
  window.__exPass = {};
  window.__exPassLayer = function (h) { window.__host = h; };
</script>
<script src="pass-layer.js"></script>
<script>
(function () {
  // THE HOST JOINS ONCE THE PACK QUESTION IS SETTLED — loaded, or refused with its reason. That is
  // one fetch later than this file's own script tag, so the page waits for it. Every road through
  // the loader ends in a join, including every refusal, so this wait always ends.
  function go() {
    if (!window.__host) { setTimeout(go, 20); return; }
    var host = window.__host;
    var gen = 900;

    // What the host says about its pack: the address, the version and digest it was told to load,
    // where the load stands, and the reason in its own words when it was refused.
    window.__pack = function () { return host.report().pack; };
    window.__registered = function () { return host.report().registered; };
    window.__events = function () {
      return host.report().events.map(function (e) { return { name: e.name, why: e.why }; });
    };

    // A real command, offered to the real host. `took` is the host's own answer: true means it has
    // taken responsibility for landing this transition, false means the walk's own glide lands it.
    window.__offer = function (score) {
      var seen = { docks: 0, glides: 0, curtains: 0 };
      var hooks = {
        dock: function () { seen.docks++; },
        glide: function () { seen.glides++; },
        curtain: function () { seen.curtains++; },
        mark: function () {},
        hangGeometry: function () { return null; },
        handoff: function () {},
      };
      var cmd = { gen: gen++, kind: "step", reduced: false, saveData: false,
                  from: { id: "a" }, to: { id: "b" },
                  params: { flightMs: { base: 3000 }, qualityTier: { base: "standard" } },
                  score: score };
      var took = host.offer(cmd, hooks) === true;
      return { took: took, seen: seen, instrument: host.report().instrument };
    };

    window.__ready = true;
  }
  go();
})();
</script>
</body>
</html>
