<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the unfold instrument — the host's frame beside the lab module's</title>
<style>
  html, body { margin:0; height:100%; background:#050507; overflow:hidden; }
  .stage { position:absolute; inset:0; }
  .hidden { visibility:hidden; }
  /* The walk's own markup, as the host reads it: the host arms and decodes both works by finding
     .exh-frame[data-id] in the document, exactly as it does on the real walk. Kept off-screen and
     out of the way so the two full-frame stages above are the only pixels a screenshot sees. */
  #walk { position:absolute; left:-10000px; top:0; width:1px; height:1px; overflow:hidden; }
</style>
</head>
<body>
<!-- TWO ROADS OF ONE FRAME, so they can be compared point for point: the host's own canvas (created
     by pass-layer.js itself, position:fixed above everything) and the lab module on its own DOM
     stage. One is visible at a time; the check shows the one it means and photographs it.

     THE LAB ROAD HERE IS THE BROWSER'S OWN COMPOSITOR. Every instrument ported before this one came
     from a module that drew with WebGL, so the two roads shared a sampler and a rasteriser. This
     module draws with CSS 3D, so the lab road is the compositor's projection, its own image
     downscaling and its own edge antialiasing. The suite states the bar it measures for that and
     names what the residual is made of. -->
<div id="moduleStage" class="stage"></div>
<div id="walk">
  <section class="exh-frame" data-id="a"><img id="imgA" src="photos/towers.jpg" alt=""></section>
  <section class="exh-frame" data-id="b"><img id="imgB" src="photos/glassgrid.jpg" alt=""></section>
</div>
<script>
  window.__errs = [];
  window.addEventListener("error", function (e) { window.__errs.push(String((e && e.message) || e)); });
  window.addEventListener("unhandledrejection", function (e) {
    window.__errs.push("rejection: " + String((e && e.reason) || e));
  });
  (function () {
    var real = console.error;
    console.error = function () {
      window.__errs.push(Array.prototype.join.call(arguments, " "));
      return real.apply(console, arguments);
    };
  })();
  // The two names pass-layer.js joins through. `__exPass` is the diagnostics surface the client
  // builds when diagnostics are on; here the bench stands in for it, so the file under test is the
  // real built artifact and nothing about it is stubbed.
  window.__exPass = {};
  window.__exPassLayer = function (h) { window.__host = h; };
</script>
<script src="pass-layer.js"></script>
<script src="unfold.js"></script>
<script>
(function () {
  var imgs = [document.getElementById("imgA"), document.getElementById("imgB")];
  var left = imgs.length;
  imgs.forEach(function (im) {
    if (im.complete && im.naturalWidth) { if (!--left) go(); return; }
    im.onload = function () { if (!--left) go(); };
    im.onerror = function () { window.__errs.push("picture did not load: " + im.src); };
  });

  var asked = false, warmed = false;
  function go() {
    // THE HOST REACHES THIS PAGE ONE FETCH LATER THAN ITS OWN SCRIPT TAG. It reads the site's own
    // settings record first — where every instrument's address, version and digest stand under the
    // instrument's own name — and joins only when that question is settled. So the bench is waited
    // for rather than assumed, which is what a real visitor's walk does too.
    if (!window.__exPass.bench || !window.__host) { setTimeout(go, 20); return; }
    // EACH INSTRUMENT TRAVELS AS ITS OWN FILE, and a visit fetches only the ones its own score
    // names. This page draws poses as well as commands, and a bench measures one instrument against
    // another as often as it measures one alone, so it asks for every instrument the site's record
    // names — by the same road an offer takes — and waits for the answer before it draws anything.
    if (!warmed) {
      if (!asked) { asked = true; window.__exPass.bench.load(window.__host.report().record.names,
                                    function () { warmed = true; }); }
      setTimeout(go, 20);
      return;
    }
    var moduleStage = document.getElementById("moduleStage");
    var bench = window.__exPass.bench;
    if (!bench || !bench.make()) { window.__errs.push("the host raised no stage"); return; }
    bench.pair(imgs[0], imgs[1]);

    var def = null;
    (window.LAB.effects || []).forEach(function (e) { if (e.id === "unfold") def = e; });
    if (!def) { window.__errs.push("the lab module registered no «unfold» effect"); return; }

    // The one record both roads read. The module keeps its own copy of these inside its closure;
    // this is the same set handed to it at creation and moved through the same onParam, so the pose
    // the host draws is the pose the module drew and never a guess at it.
    var P = { tilt: 0.5, shade: 1, depth: 0.5, stagger: 0.34, panels: 1 };
    var hand = 0, clockAt = 0, maskAt = 0, workAt = "a";
    var api = null;

    // THE MODULE TAKES ONE PICTURE. lab/data/module-contract.json records it as `needsTwoWorks:
    // false`, so the lab road stands one work at a time: the first work over the first half of the
    // hand and the second over the last half, which is the crossing the port plays. Building it is
    // how the work is chosen, since the module reads its images once at creation.
    function build(which) {
      if (api) { api.destroy(); api = null; }
      workAt = which;
      var ctx = { images: [which === "b" ? imgs[1] : imgs[0]], reduced: false,
                  params: { mode: P.panels >= 0.5 ? "four" : "two", tilt: P.tilt, shade: P.shade,
                            depth: P.depth, stagger: P.stagger } };
      api = def.create(moduleStage, ctx);
      api.onParam("clock", clockAt);
      window.__api = api;
    }
    build("a");

    // THE FOLD THE PORT COMPUTED, HANDED TO THE MODULE RAW. The module's own `rawFold` is the seam
    // its own seat measures the response curve through: it takes the fold behind the hand's own,
    // which is exactly the number the instrument's `values()` answers with. So the curve is applied
    // once, on the port's side, and the two roads stand at ONE fold rather than at two readings of
    // one dial.
    window.__labFold = function (v) { api.rawFold(+v); };
    window.__labWork = function (which) { build(which); };
    window.__labAt = function () { return workAt; };

    window.__mix = function (v) { hand = +v; };
    window.__clock = function (s) { clockAt = +s; api.onParam("clock", s); };
    window.__param = function (k, v) {
      P[k] = +v;
      if (k === "panels") { build(workAt); return; }
      api.onParam(k, v);
    };
    window.__mask = function (v) { maskAt = +v; };
    // THE WORLD THE SHEET OPENS INTO. The lab module has no world at all — it draws one sheet with
    // CSS 3D and stops at its own edge — so these three reach the instrument and never the module.
    // They rest at the closed sheet, which is why every row that compares the two roads goes on
    // comparing them without naming any of the three.
    var WORLD = { field: 0, parquetPeriod: 0.5, parquetTurn: 0 };
    window.__world = function (o) {
      Object.keys(o || {}).forEach(function (k) { WORLD[k] = +o[k]; });
      return WORLD;
    };
    window.__show = function (which) {
      bench.show(which === "host");
      moduleStage.classList.toggle("hidden", which !== "module");
    };

    function pose() {
      return { mix: hand, tilt: P.tilt, shade: P.shade, depth: P.depth, stagger: P.stagger,
               panels: P.panels, mask: maskAt, t: clockAt, reduced: false,
               field: WORLD.field, parquetPeriod: WORLD.parquetPeriod,
               parquetTurn: WORLD.parquetTurn,
               aw: imgs[0].naturalWidth, ah: imgs[0].naturalHeight,
               bw: imgs[1].naturalWidth, bh: imgs[1].naturalHeight };
    }
    window.__pose = pose;
    window.__values = function () { return bench.values("unfold", pose()); };

    // THE HOST DRAWS THE SAME POSE, through the same drawPose a running transaction takes.
    window.__hostDraw = function () { bench.draw("unfold", pose()); return bench.values("unfold", pose()); };

    // BOTH ROADS AT ONE POSE. The port's own `values()` answers the raw fold behind the dial, and
    // that number is handed straight to the module; the module is rebuilt on the work whose sheet
    // the port is standing at that instant.
    window.__both = function (v) {
      hand = +v;
      var r = bench.values("unfold", pose());
      var want = r.cross >= 0.5 ? "b" : "a";
      if (want !== workAt) build(want);
      api.onParam("clock", clockAt);
      api.rawFold(r.fold);
      return r;
    };

    // ---- the real transaction road ---------------------------------------------------------
    // A hand-made command of exactly the shape the bundle freezes, offered to the real host: it
    // arms and decodes both works off the walk markup above, builds the programme from the
    // manifest, raises its curtain and runs its own frame loop.
    var gen = 100;
    window.__hooks = { docks: [], curtains: [], glides: [], marks: [] };
    var hooks = {
      dock: function (c) { window.__hooks.docks.push(c.gen); },
      glide: function (c) { window.__hooks.glides.push(c.gen); },
      curtain: function (on) { window.__hooks.curtains.push(!!on); },
      mark: function (n) { window.__hooks.marks.push(n); },
    };
    window.__offer = function (score, opts) {
      opts = opts || {};
      window.__host.configure({
        prepareBudgetMs: 400, settleSlackMs: 2000, fixedScale: true,
        clockPin: opts.clock === undefined ? null : opts.clock,
        progressPin: opts.progress === undefined ? null : opts.progress,
      });
      var cmd = {
        gen: ++gen, from: { id: "a", n: 1 }, to: { id: "b", n: 2 },
        kind: "step", cause: "bench", dir: 1, span: 100, velocity: 0,
        reduced: false, saveData: false, rtl: false, dpr: window.devicePixelRatio || 1,
        viewport: { w: innerWidth, h: innerHeight },
        params: { flightMs: { base: 3000 }, qualityTier: { base: opts.tier || "standard" } },
        score: score,
      };
      return { took: window.__host.offer(cmd, hooks) === true, gen: cmd.gen };
    };
    window.__cancel = function (why) { window.__host.cancel(why || "bench"); };
    window.__report = function () { return window.__host.report(); };
    window.__resize = function () { window.__host.resize({ w: innerWidth, h: innerHeight }); };
    window.__ready = true;
  }
})();
</script>
</body>
</html>
