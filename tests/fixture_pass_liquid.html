<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the liquid instrument — the host's frame beside the lab module's</title>
<style>
  html, body { margin:0; height:100%; background:#050507; overflow:hidden; }
  .stage { position:absolute; inset:0; }
  .hidden { visibility:hidden; }
  /* The walk's own markup, as the host reads it: the host arms and decodes both works by finding
     .exh-frame[data-id] in the document, exactly as it does on the real walk. Kept off-screen and
     out of the way so the two full-frame stages above are the only pixels a screenshot sees. */
  #walk { position:absolute; left:-10000px; top:0; width:1px; height:1px; overflow:hidden; }
</style>
</head>
<body>
<!-- TWO ROADS OF ONE FRAME, so they can be compared point for point: the host's own canvas (created
     by pass-layer.js itself, position:fixed above everything) and the lab module on its own canvas.
     One is visible at a time; the check shows the one it means and photographs it.

     THE EQUIVALENCE ROAD, and why it is honest. The lab module carries ONE work and this instrument
     carries an ordered pair, so the two can only ever be one frame where the pair is one work: the
     host is handed the SAME photograph in both of its source slots, the handover then mixes that
     work with itself at every point, and what is left standing is exactly the module's own water.
     Every other number the two roads are driven by is the same number moved through the same
     handle. -->
<div id="moduleStage" class="stage"></div>
<div id="walk">
  <section class="exh-frame" data-id="a"><img id="imgA" src="photos/towers.jpg" alt=""></section>
  <section class="exh-frame" data-id="b"><img id="imgB" src="photos/glassgrid.jpg" alt=""></section>
</div>
<script>
  window.__errs = [];
  window.addEventListener("error", function (e) { window.__errs.push(String((e && e.message) || e)); });
  window.addEventListener("unhandledrejection", function (e) {
    window.__errs.push("rejection: " + String((e && e.reason) || e));
  });
  (function () {
    var real = console.error;
    console.error = function () {
      window.__errs.push(Array.prototype.join.call(arguments, " "));
      return real.apply(console, arguments);
    };
  })();
  // The two names pass-layer.js joins through. `__exPass` is the diagnostics surface the client
  // builds when diagnostics are on; here the bench stands in for it, so the file under test is the
  // real built artifact and nothing about it is stubbed.
  window.__exPass = {};
  window.__exPassLayer = function (h) { window.__host = h; };
</script>
<script src="pass-layer.js"></script>
<script src="liquid.js"></script>
<script>
(function () {
  var imgs = [document.getElementById("imgA"), document.getElementById("imgB")];
  var left = imgs.length;
  imgs.forEach(function (im) {
    if (im.complete && im.naturalWidth) { if (!--left) go(); return; }
    im.onload = function () { if (!--left) go(); };
    im.onerror = function () { window.__errs.push("picture did not load: " + im.src); };
  });

  var asked = false, warmed = false;
  function go() {
    // THE HOST REACHES THIS PAGE ONE FETCH LATER THAN ITS OWN SCRIPT TAG. It reads the site's own
    // settings record first — where every instrument's address, version and digest stand under the
    // instrument's own name — and joins only when that question is settled.
    if (!window.__exPass.bench || !window.__host) { setTimeout(go, 20); return; }
    if (!warmed) {
      if (!asked) { asked = true; window.__exPass.bench.load(window.__host.report().record.names,
                                    function () { warmed = true; }); }
      setTimeout(go, 20);
      return;
    }
    var moduleStage = document.getElementById("moduleStage");
    var bench = window.__exPass.bench;
    if (!bench || !bench.make()) { window.__errs.push("the host raised no stage"); return; }

    var def = null;
    (window.LAB.effects || []).forEach(function (e) { if (e.id === "liquid") def = e; });
    if (!def) { window.__errs.push("the lab module registered no «liquid» effect"); return; }

    // THE MODULE'S OWN DECLARED DEFAULTS (liquid.js:214-216). `strength` is what the module derives
    // its water's own life from, and it is the one of the three that reaches this port at all — the
    // port pins it at this very number, so the two roads carry one life.
    var LAB_PARAMS = { strength: 55, heal: 50, refraction: 45 };
    var ctx = { images: [imgs[0]], params: { strength: LAB_PARAMS.strength, heal: LAB_PARAMS.heal,
                                             refraction: LAB_PARAMS.refraction }, reduced: false };
    var api = def.create(moduleStage, ctx);
    window.__api = api;

    // The one record both roads read. Nothing here is a guess at what the other road is doing: each
    // number is moved through the module's own handle and through the host's pose in one call.
    var P = { wet: 0, clock: 0, swell: 0.5, crest: 0.702, seed: 0, which: 0 };
    var D0 = 0.05;

    // The dial that puts this instrument's water at the module's own `wet`. The port's crossing dial
    // raises the water on one sine over the whole passage, so the hand that stands the water at `w`
    // is the inverse of that sine with the dead band put back on.
    window.__mixFor = function (w) {
      var x = Math.asin(Math.min(1, Math.max(0, w))) / Math.PI;
      return D0 + (1 - 2 * D0) * x;
    };

    function pushLab() {
      api.onParam("wet", P.wet);
      api.onParam("clock", P.clock);
      api.onParam("wave", P.swell);
      // the module stores `feelSpread(u)` behind its own handle, and the port applies the same
      // curve behind its own, so the two take the SAME raw share
      api.onParam("spread", P.crest);
      // the module's advect is a phase over one whole wave with its own rest at the middle of the
      // handle; the port spends the score's die on that phase with its rest at nothing
      api.onParam("advect", (P.seed / 8 + 0.5) % 1);
    }
    pushLab();

    window.__lab = function (k, v) { P[k] = +v; pushLab(); };
    window.__set = function (k, v) { P[k] = +v; if (k !== "which") pushLab(); };
    window.__which = function (i) { P.which = +i; };
    window.__show = function (which) {
      bench.show(which === "host");
      moduleStage.classList.toggle("hidden", which !== "module");
    };

    // THE HOST DRAWS THE SAME POSE. `which` says which of the two photographs stands in BOTH of the
    // host's slots for the equivalence road; a door row hands the two different works instead.
    function poseOf(o) {
      o = o || {};
      var a = imgs[o.a === undefined ? P.which : o.a];
      var b = imgs[o.b === undefined ? P.which : o.b];
      return {
        mix: o.mix === undefined ? window.__mixFor(P.wet) : +o.mix,
        swell: o.swell === undefined ? P.swell : +o.swell,
        crest: o.crest === undefined ? P.crest : +o.crest,
        refract: o.refract === undefined ? LAB_PARAMS.refraction / 100 : +o.refract,
        seed: o.seed === undefined ? P.seed : +o.seed,
        shade: o.shade === undefined ? 1 : +o.shade,
        travel: o.travel === undefined ? 1 : +o.travel,
        mask: o.mask === undefined ? 0 : +o.mask,
        t: o.t === undefined ? P.clock : +o.t,
        reduced: !!o.reduced,
        cssWidth: innerWidth, cssHeight: innerHeight,
        bufWidth: o.bufWidth === undefined ? Math.round(innerWidth * (window.devicePixelRatio || 1))
                                           : +o.bufWidth,
        bufHeight: o.bufHeight === undefined ? Math.round(innerHeight * (window.devicePixelRatio || 1))
                                             : +o.bufHeight,
        aw: a.naturalWidth, ah: a.naturalHeight, bw: b.naturalWidth, bh: b.naturalHeight,
      };
    }
    window.__pose = poseOf;
    window.__values = function (o) { return bench.values("liquid", poseOf(o)); };
    window.__manifest = function () { return bench.manifest("liquid"); };
    window.__hostDraw = function (o) {
      var p = poseOf(o);
      var a = imgs[o && o.a !== undefined ? o.a : P.which];
      var b = imgs[o && o.b !== undefined ? o.b : P.which];
      bench.pair(a, b);
      bench.draw("liquid", p);
      return p;
    };

    // ---- the real transaction road ---------------------------------------------------------
    // A hand-made command of exactly the shape the bundle freezes, offered to the real host: it
    // arms and decodes both works off the walk markup above, builds the programme from the
    // manifest, raises its curtain and runs its own frame loop.
    var gen = 100;
    window.__hooks = { docks: [], curtains: [], glides: [], marks: [] };
    var hooks = {
      dock: function (c) { window.__hooks.docks.push(c.gen); },
      glide: function (c) { window.__hooks.glides.push(c.gen); },
      curtain: function (on) { window.__hooks.curtains.push(!!on); },
      mark: function (n) { window.__hooks.marks.push(n); },
    };
    window.__offer = function (score, opts) {
      opts = opts || {};
      window.__host.configure({
        prepareBudgetMs: 400, settleSlackMs: 2000, fixedScale: true,
        clockPin: opts.clock === undefined ? null : opts.clock,
        progressPin: opts.progress === undefined ? null : opts.progress,
      });
      var cmd = {
        gen: ++gen, from: { id: "a", n: 1 }, to: { id: "b", n: 2 },
        kind: "step", cause: "bench", dir: 1, span: 100, velocity: 0,
        reduced: false, saveData: false, rtl: false, dpr: window.devicePixelRatio || 1,
        viewport: { w: innerWidth, h: innerHeight },
        params: { flightMs: { base: 3000 }, qualityTier: { base: opts.tier || "standard" } },
        score: score,
      };
      return { took: window.__host.offer(cmd, hooks) === true, gen: cmd.gen };
    };
    window.__cancel = function (why) { window.__host.cancel(why || "bench"); };
    window.__report = function () { return window.__host.report(); };
    window.__resize = function () { window.__host.resize({ w: innerWidth, h: innerHeight }); };
    window.__ready = true;
  }
})();
</script>
</body>
</html>
